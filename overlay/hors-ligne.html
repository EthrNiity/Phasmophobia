<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Grimoire Overlay</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-content:center;gap:14px;padding:24px;text-align:center;
    background:#16110c;color:#eadfc4;font:15px/1.5 Georgia,serif;-webkit-app-region:drag}
  svg{width:46px;height:56px;margin:0 auto;color:#e3b464}
  h1{margin:0;font-weight:400;font-size:22px}
  p{margin:0;color:#ae9c80;font-size:14px}
  button{-webkit-app-region:no-drag;justify-self:center;font:13px ui-monospace,Consolas,monospace;color:#0d221d;background:#7fd3bf;border:0;border-radius:2px;padding:8px 16px;cursor:pointer}
</style>
</head>
<body>
  <svg viewBox="0 0 100 120" aria-hidden="true"><path d="M12 112V50a38 38 0 0 1 76 0v62l-12.7-11-12.6 11L50 101l-12.7 11-12.6-11z" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/><circle cx="37" cy="50" r="6" fill="currentColor"/><circle cx="63" cy="50" r="6" fill="currentColor"/></svg>
  <h1>Le Grimoire ne répond pas</h1>
  <p>Pas de connexion pour l’instant. Nouvel essai dans <span id="n">15</span> s.</p>
  <button id="go" type="button">Réessayer</button>
<script>
  const cible = new URLSearchParams(location.search).get("cible") || "https://ethrniity.github.io/Phasmophobia/?vue=compact";
  const ok = /^https:\/\/ethrniity\.github\.io\/Phasmophobia\//.test(cible);
  const aller = () => { location.href = ok ? cible : "https://ethrniity.github.io/Phasmophobia/?vue=compact"; };
  document.getElementById("go").addEventListener("click", aller);
  let n = 15; setInterval(() => { n--; document.getElementById("n").textContent = Math.max(n, 0); if (n <= 0) aller(); }, 1000);
</script>
</body>
</html>
